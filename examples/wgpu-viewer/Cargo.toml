[package]
name = "tuile-wgpu-viewer"
description = "Demo viewer for tuile: winit + tuile-wgpu"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
glam = { workspace = true }
pollster = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tuile-atmosphere = { version = "0.4.0", path = "../../crates/tuile-atmosphere" }
tuile-camera = { version = "0.4.0", path = "../../crates/tuile-camera" }
tuile-core = { version = "0.4.0", path = "../../crates/tuile-core" }
tuile-cesium-ion = { version = "0.4.0", path = "../../crates/tuile-cesium-ion" }
tuile-bing = { version = "0.4.0", path = "../../crates/tuile-bing" }
tuile-planetary = { version = "0.4.0", path = "../../crates/tuile-planetary" }
tuile-storage-foyer = { version = "0.4.0", path = "../../crates/tuile-storage-foyer" }
tuile-tape = { version = "0.4.0", path = "../../crates/tuile-tape" }
# Ctrl-C, SIGTERM and SIGHUP have to end the *session*, not the process: a
# recording is most valuable in exactly the run that ends badly. A safe wrapper
# rather than raw `libc::signal`, because the workspace denies `unsafe_code`.
ctrlc = { version = "3.5", features = ["termination"] }
# The Prometheus bridge. It lives in its own crate rather than here because
# nothing about publishing the engine's counters is specific to a wgpu window:
# the headless probes and the warm-up job want exactly the same endpoint.
tuile-metrics = { version = "0.4.0", path = "../../crates/tuile-metrics" }
tuile-terrain = { version = "0.4.0", path = "../../crates/tuile-terrain" }
tuile-native-fetchers = { version = "0.4.0", path = "../../crates/tuile-native-fetchers" }
tuile-ui = { version = "0.4.0", path = "../../crates/tuile-ui", features = ["statusbar"] }
tuile-wgpu = { version = "0.4.0", path = "../../crates/tuile-wgpu" }
wgpu = { workspace = true }
winit = { workspace = true }

# The operating system's location service, for `--here` and the `L` key.
# macOS only, and only this example: no library crate knows where the machine
# is. Without the feature, or on another platform, the flag and the key answer
# "not available" and the viewer runs as it always did.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.4", optional = true }
objc2-foundation = { version = "0.3.2", optional = true, default-features = false, features = ["std", "NSArray", "NSError", "NSString"] }
objc2-core-location = { version = "0.3.2", optional = true, default-features = false, features = ["std", "CLLocation", "CLLocationManager", "CLLocationManagerDelegate"] }

[features]
default = ["current-location"]
current-location = ["dep:objc2", "dep:objc2-foundation", "dep:objc2-core-location"]
