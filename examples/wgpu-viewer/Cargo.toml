[package]
name = "tuile-wgpu-viewer"
description = "Demo viewer for tuile: the tuile-viewer application over the public connectors"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

# The application is `tuile-viewer`. What is left here is the one decision a
# host makes: where terrain and imagery come from. This binary answers with the
# public connectors; another host answers with its own and reuses the rest.
[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
tuile-bing = { version = "0.14.0", path = "../../crates/tuile-bing" }
tuile-cesium-ion = { version = "0.14.0", path = "../../crates/tuile-cesium-ion" }
tuile-native-fetchers = { version = "0.14.0", path = "../../crates/tuile-native-fetchers" }
tuile-viewer = { version = "0.14.0", path = "../../crates/tuile-viewer" }
# The catalog proxy's address, read and checked as a URL: Android's, and a
# headless run's.
url = { workspace = true }

# The headless runner (`examples/headless`): this host's application, driven
# through its control API over the real catalog — through a catalog proxy
# served in the runner's process, which alone holds the token. Run on demand:
# `cargo run --release -p tuile-wgpu-viewer --example headless -- run all`.
[dev-dependencies]
axum = "0.8"
# The runner's `--pictures`: a settled frame written as PNG.
image = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["net"] }
tracing-subscriber = { workspace = true }
tuile-cesium-ion = { version = "0.14.0", path = "../../crates/tuile-cesium-ion", features = ["proxy"] }
tuile-viewer = { version = "0.14.0", path = "../../crates/tuile-viewer", features = ["control"] }
# The sunset sequence (`examples/sunset`): its instants, from the ephemeris.
tuile-atmosphere = { version = "0.14.0", path = "../../crates/tuile-atmosphere" }
tuile-core = { version = "0.14.0", path = "../../crates/tuile-core" }
# The replay (`examples/replay`): a recorded session read, and written again.
glam = { workspace = true }
tuile-camera = { version = "0.14.0", path = "../../crates/tuile-camera" }
tuile-tape = { version = "0.14.0", path = "../../crates/tuile-tape" }
