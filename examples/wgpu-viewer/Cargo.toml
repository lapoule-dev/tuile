[package]
name = "tuile-wgpu-viewer"
description = "Demo viewer for tuile: the tuile-viewer application over the public connectors"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

# The application is `tuile-viewer`. What is left here is the one decision a
# host makes: where terrain and imagery come from. This binary answers with the
# public connectors; another host answers with its own and reuses the rest.
[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
tuile-bing = { version = "0.4.0", path = "../../crates/tuile-bing" }
tuile-cesium-ion = { version = "0.4.0", path = "../../crates/tuile-cesium-ion" }
tuile-core = { version = "0.4.0", path = "../../crates/tuile-core" }
tuile-native-fetchers = { version = "0.4.0", path = "../../crates/tuile-native-fetchers" }
tuile-planetary = { version = "0.4.0", path = "../../crates/tuile-planetary" }
tuile-terrain = { version = "0.4.0", path = "../../crates/tuile-terrain" }
tuile-viewer = { version = "0.4.0", path = "../../crates/tuile-viewer" }
