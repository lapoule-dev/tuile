[package]
name = "tuile-bevy-viewer"
description = "A Bevy application showing tuile's globe: a camera the application drives, an orbit controller, and meshes of its own sharing the ground's depth"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
bevy = { version = "0.20.0", default-features = false, features = ["std", "bevy_render", "bevy_core_pipeline", "bevy_camera", "bevy_log", "bevy_pbr", "bevy_window", "bevy_winit", "bevy_asset", "png", "multi_threaded", "x11", "tonemapping_luts", "ktx2", "zstd_rust"] }
glam = { workspace = true }
tuile-core = { version = "0.15.0", path = "../../crates/tuile-core" }
tuile-bevy = { version = "0.15.0", path = "../../crates/tuile-bevy" }
url = { workspace = true }

# A page: the JS bindings, and the page's address the options are read from.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.76"
wasm-bindgen = "0.2.99"
web-sys = { version = "0.3.76", features = ["Location", "Window"] }

# Which browser API the page draws with: one build each, as Bevy compiles its
# shaders for one or the other (`web/build.sh`).
[features]
webgpu = ["bevy/webgpu"]
webgl2 = ["bevy/webgl2"]
