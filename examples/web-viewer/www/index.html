<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tuile — streaming globe (THREE.js)</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        background: #05070d;
        color: #d7dce5;
        overflow: hidden;
      }
      #view { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
      .panel {
        position: fixed;
        top: 12px; left: 12px;
        padding: 10px 12px;
        background: rgba(8, 11, 18, 0.82);
        border: 1px solid #232a38;
        border-radius: 8px;
        backdrop-filter: blur(6px);
        max-width: min(560px, calc(100vw - 24px));
      }
      input {
        width: 320px; max-width: 52vw;
        padding: 5px 7px;
        background: #0d111a; color: inherit;
        border: 1px solid #2b3446; border-radius: 5px;
        font: inherit;
      }
      button {
        padding: 5px 12px;
        background: #2d5bd7; color: #fff;
        border: 0; border-radius: 5px;
        font: inherit; cursor: pointer;
      }
      button:hover { background: #3a68e4; }
      #status { margin-top: 8px; color: #8f9bb0; }
      .hint { margin-top: 6px; color: #5f6b80; }
    </style>
    <!-- Pinned rather than floating: a renderer that silently changes version
         under a differential test stops being a control. -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.171.0/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div class="panel">
      <div>
        <input id="token" type="password" placeholder="CESIUM_ION_TOKEN" autocomplete="off" />
        <button id="run">start</button>
      </div>
      <div id="status">paste a Cesium ion token and press start</div>
      <div class="hint">drag to orbit · wheel to zoom</div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
