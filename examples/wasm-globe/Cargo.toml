[package]
name = "wasm-globe"
description = "Raw-wasm demo: assemble the ion globe and drive a Pyrénées view entirely in the browser (no server, no wgpu). JS only does fetch; this wasm does traversal + decode + geometry and returns a GeometryReport."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
glam = { workspace = true }
serde = { workspace = true }
url = { workspace = true }
wasm-bindgen = "0.2.99"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
tuile-core = { version = "0.0.1", path = "../../crates/tuile-core" }
tuile-terrain = { version = "0.0.1", path = "../../crates/tuile-terrain" }
tuile-bing = { version = "0.0.1", path = "../../crates/tuile-bing" }
