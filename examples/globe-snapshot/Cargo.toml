[package]
name = "globe-snapshot"
description = "Render a real globe patch (Cesium World Terrain + Bing imagery via ion) to a PNG"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1"
glam = "0.33"
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
wgpu = "29"
tuile-core = { version = "0.0.1", path = "../../crates/tuile-core", features = ["http"] }
tuile-terrain = { version = "0.0.1", path = "../../crates/tuile-terrain" }
tuile-cesium-ion = { version = "0.0.1", path = "../../crates/tuile-cesium-ion", features = ["reqwest"] }
tuile-bing = { version = "0.0.1", path = "../../crates/tuile-bing" }
tuile-wgpu = { version = "0.0.1", path = "../../crates/tuile-wgpu" }
