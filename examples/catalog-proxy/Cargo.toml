[package]
name = "tuile-catalog-proxy"
description = "The tile catalog behind a proxy that holds its token, for the web viewer: the same binary on a developer's machine and in production"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

# The proxy itself is the ion connector's (`tuile_cesium_ion::proxy`); this
# binary reads its configuration, serves it, and — for development — serves a
# page beside it.
[dependencies]
anyhow = { workspace = true }
axum = "0.8"
tokio = { workspace = true, features = ["net", "signal"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
# HTTPS for a phone on the local network, which gives WebGPU, geolocation and
# the clipboard only to a secure page: the TLS stack reqwest already brings.
tokio-rustls = { version = "0.26", default-features = false }
rustls-pki-types = { version = "1", features = ["std"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tuile-cesium-ion = { version = "0.15.1", path = "../../crates/tuile-cesium-ion", features = ["proxy"] }
url = { workspace = true }
