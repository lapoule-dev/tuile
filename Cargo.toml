[workspace]
resolver = "2"
members = [
    "crates/tuile-atmosphere",
    "crates/tuile-bake",
    "crates/tuile-b3dm",
    "crates/tuile-bevy",
    "crates/tuile-bing",
    "crates/tuile-budget",
    "crates/tuile-cesium-ion",
    "crates/tuile-farm",
    "crates/tuile-film",
    "crates/tuile-overlay",
    "crates/tuile-film-gpu",
    "crates/tuile-film-native",
    "crates/tuile-mp4",
    "crates/tuile-pack-api",
    "crates/tuile-repository",
    "crates/tuile-camera",
    "crates/tuile-native-fetchers",
    "crates/tuile-pack",
    "crates/tuile-core",
    "crates/tuile-hydra",
    "crates/tuile-metrics",
    "crates/tuile-planetary",
    "crates/tuile-radiometry",
    "crates/tuile-record",
    "crates/tuile-star-catalogue",
    "crates/tuile-storage-foyer",
    "crates/tuile-tape",
    "crates/tuile-terrain",
    "crates/tuile-tile-server",
    "crates/tuile-usd",
    "crates/tuile-web",
    "crates/tuile-ui",
    "crates/tuile-viewer",
    "crates/tuile-viewer-bundle",
    "crates/tuile-wgpu",
    "examples/bevy-viewer",
    "examples/catalog-proxy",
    "examples/decode-bench",
    "examples/globe-bulk",
    "examples/heightfield-serve",
    "examples/orbit-probe",
    "examples/warm-cache",
    "examples/wgpu-viewer",
]

[workspace.package]
version = "0.15.1"
edition = "2021"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
authors = ["lapoule.dev"]
# Shared by every crate that is published (docs/releasing.md). `readme` is
# each crate's own README.md, found by cargo; `documentation` is docs.rs's
# page, which crates.io links by default.
repository = "https://github.com/lapoule-dev/tuile"
homepage = "https://tuile.lapoule.dev"
keywords = ["3d-tiles", "geospatial", "globe", "terrain", "ogc"]
categories = ["science::geo", "rendering", "graphics"]

[workspace.dependencies]
# Single source of truth for shared external crates, so the whole workspace
# builds one copy of each (one DVec3, one error type, one async runtime).
# Features are additive and unified across the graph: a feature listed here is
# enabled wherever the dep is used — harmless for crates that don't need it.
glam = { version = "0.33.2", features = ["serde"] }
half = "2.7"
# NREL's Solar Position Algorithm (Reda & Andreas 2003). Pre-1.0, in the
# wasm path through tuile-atmosphere: see that crate's `sun` module for why
# this one. libm, no std: the same bits on every target.
solar-positioning = { version = "0.7.1", default-features = false, features = ["libm"] }
# The Moon: Meeus's *Astronomical Algorithms* (ch. 22, 47: nutation and the
# ELP-2000/82 series truncated to 10" in longitude, 4" in latitude), the
# most used Rust implementation of it. MIT, pure Rust, no dependency, builds
# for wasm32; frozen since 2016 like the series it evaluates.
#
# lapoule-dev's fork, pinned: 2.0.0's `mn_oblq_IAU` evaluates its polynomial
# in ten thousand years instead of centuries, fixed there. A git dependency:
# crates.io refuses it, so no crate that depends on this can be published
# there until upstream is fixed.
astro = { git = "https://github.com/lapoule-dev/astro-rust", rev = "09bf6194fec14a57541f7dd97e03bcbca82f109c" }
# Second-order IIR filters; the camera path smoothing runs its low-pass both
# ways. no_std, one dependency (num-traits), MIT OR Apache-2.0.
biquad = "0.6.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
# Tables of measures (an instrument's rows, a scene's disc energy) written as
# Parquet, the columnar file every notebook reads. The file writer alone: no
# Arrow, no codecs.
parquet = { version = "58.4.0", default-features = false }
roxmltree = "0.20"
thiserror = "2.0.18"
# The budget's resource index (`tuile-budget`'s arena): the hash table std's
# own map is built on, keyed by an index into the arena's columns, hashed with
# a fixed seed — probed, never iterated. no_std, wasm-clean.
hashbrown = { version = "0.16.1", default-features = false, features = ["inline-more"] }
foldhash = { version = "0.2.0", default-features = false }
bytes = "1.11.1"
# The budget's draw items hold their drapes (one or two) and the tiles they
# serve (one, a few for a fallback) in place: a step's output allocates
# nothing for them. The de facto standard, no_std, wasm-clean.
smallvec = "1.15.2"
async-trait = "0.1.89"
url = "2.5.8"
futures-channel = "0.3.32"
futures-core = "0.3.32"
futures-util = { version = "0.3.32", default-features = false, features = ["std", "alloc", "async-await"] }
futures-executor = "0.3.32"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
# KTX 2.0 and the UASTC transcoders, on the CPU: no default features, so no
# wgpu.
texcomp = { git = "https://github.com/lapoule-dev/texcomp", tag = "v0.2.0", default-features = false }
wgpu = "30.0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
anyhow = "1.0.102"
pollster = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "gzip", "cookies"] }
reqwest-middleware = "0.5"
http-cache-reqwest = { version = "1.0.0-alpha.6", default-features = false, features = ["manager-foyer", "url-standard"] }
http-cache = { version = "1.0.0-alpha.6", default-features = false, features = ["manager-foyer", "url-standard"] }
foyer = "0.22.3"
gltf = "1.4.1"
nalgebra = { version = "0.35", default-features = false, features = ["std"] }
nalgebra-sparse = "0.12"
petgraph = { version = "0.8", default-features = false }
flate2 = "1.1.9"
bytemuck = { version = "1", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
winit = "0.30.13"
# `std::time::Instant` panics on wasm32-unknown-unknown; this is the same type
# on native and `performance.now()` in a browser. Already in the graph through
# winit, which uses it for the same reason.
web-time = "1.1"
dotenvy = "0.15"
tempfile = "3"
# Property tests (dev only): the de facto standard for Rust, shrinking
# included. No default features: no fork, no timeout, no regex strategies.
proptest = { version = "1.7", default-features = false, features = ["std"] }
# The budget's `decide` bench: no plots, no rayon, the cargo-bench runner only.
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
panic = "warn"
# `#[async_trait]` puts `#[must_use]` on the boxed future it returns, which is
# must_use already: the expansion's, not ours to remove.
double_must_use = "allow"

[profile.release]
lto = "thin"

# Profilable, because an unprofilable release build is one nobody can fix.
#
# `strip = true` sat here, and a `sample` of a live session came back with every
# Rust frame as `???` — the whole engine invisible, only Metal and libsystem
# named. The one thing a profile is for, saying *which of our functions* is
# spending the time, was the one thing it could not do.
#
# `line-tables-only` is the cheap half of debug info: function names and line
# numbers, no local variable types. It is what a sampling profiler reads, and it
# costs a fraction of `debug = true` in size and link time. On macOS the tables
# go to a `.dSYM` beside the binary rather than inside it, so what ships is
# unchanged — `strip` was buying nothing here that `split-debuginfo` does not.
debug = "line-tables-only"
split-debuginfo = "packed"

# `pmtiles` with public accessors for directory entries and header sections
# (lapoule-dev fork, branch `tuile-accessors`, one commit on top of v0.24.0).
# The tile store's projections read an archive's directories and fetch tile
# bytes by coalesced ranges, which needs to know where each tile lies. To be
# dropped once the same change is released upstream.
[patch.crates-io]
pmtiles = { git = "https://github.com/lapoule-dev/pmtiles-rs.git", branch = "tuile-accessors" }

# The atmosphere's tables are built by a few hundred million ray-march steps
# on the CPU: unoptimised, a test or a debug film waits half a minute for
# each atmosphere it makes. Its arithmetic is the same at any level.
[profile.dev.package.tuile-atmosphere]
opt-level = 3

# A ground's heights are checked against reading every triangle of every
# tile, tens of thousands of times: unoptimised, that test alone takes four
# minutes, optimised a few seconds. Its arithmetic is the same at any level.
[profile.dev.package.tuile-film]
opt-level = 3
