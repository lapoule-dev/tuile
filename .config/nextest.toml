# The test runner CI uses: every test in its own process, every binary's
# tests in one pool, so one slow binary no longer holds all the others back
# the way `cargo test` runs them, one binary after the other. Doc-tests are
# not nextest's: CI runs them with `cargo test --doc`.

[profile.default]
# The longest tests start first: a run cannot end before they do, so starting
# them last is what makes a run as long as their sum with everything else.
slow-timeout = { period = "60s" }

[[profile.default.overrides]]
filter = '''
    binary_id(tuile-wgpu::sky_flicker)
    | binary_id(tuile-wgpu::fast_zoom_never_empties)
    | binary_id(tuile-planetary::selection_covers_the_ground)
    | binary_id(tuile-budget::budget_properties)
    | binary_id(tuile-budget::budget_sim)
    | binary_id(tuile-bake::ground_memory)
    | binary_id(tuile-film-gpu::atmosphere)
    | binary_id(tuile-film-gpu::headless)
'''
priority = 100

[profile.ci]
# Every failure of a run, not the first one only.
fail-fast = false
failure-output = "immediate-final"
slow-timeout = { period = "60s" }

[profile.ci.junit]
path = "junit.xml"

# The slow tests: `#[ignore = "slow: ..."]` in the source, so the default and
# `ci` runs skip them. `--profile slow` selects exactly these (the list is the
# profile's default filter) and `--run-ignored only` runs them:
#
#   cargo nextest run --profile slow --run-ignored only --workspace
#
# A test tagged `slow:` must be added here, or it never runs anywhere
# (docs/20-conventions.md).
[profile.slow]
default-filter = '''
    test(=the_height_is_every_triangle_s_answer_bit_for_bit)
    | test(=a_zone_s_tiles_are_exactly_its_id_ranges)
    | test(=the_ground_kept_small_answers_the_heights_of_the_meshes_as_they_came)
    | test(=grounds_out_for_reading_weigh_no_more_than_the_budget)
    | test(=grounds_out_for_reading_and_selections_held_are_bounded)
    | test(=enough_tiles_to_need_leaf_directories_still_read_back)
    | test(=directory_entries_locate_tile_bytes_exactly)
    | test(=the_field_is_the_same_fit_whatever_the_tiles_are_measured_by)
'''
fail-fast = false
failure-output = "immediate-final"
slow-timeout = { period = "120s" }

[profile.slow.junit]
path = "junit.xml"
