[package]
name = "decode-bench"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# Standalone: not a member of the tuile workspace.
[workspace]

[dependencies]
image-webp = "0.2.4"
libwebp-sys = "0.14.4"
zune-jpeg = "0.5.15"
zune-core = "0.5"
jpeg-decoder = "0.3.2"
turbojpeg = { version = "1.5.1", default-features = false, features = ["pkg-config"] }

[profile.release]
debug = false
