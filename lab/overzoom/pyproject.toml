[project]
name = "overzoom"
version = "0.1.0"
description = "Super-resolution past the deepest level of an imagery tile pyramid: dataset, inference, exploration."
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
dependencies = [
    "numpy>=1.24",
    "pillow>=10",
    "pandas>=2",
    "pyarrow>=14",
    "scikit-image>=0.22",
    "pmtiles>=3.4",
    "requests>=2.31",
]

[project.optional-dependencies]
# Only on the GPU machine.
infer = [
    "torch>=2.1",
    "spandrel>=0.4",
    "huggingface_hub>=0.24",
    "lpips>=0.1.4",
]
explore = ["matplotlib>=3.8", "ipywidgets>=8", "jupyterlab>=4"]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.6", "pandas-stubs>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/overzoom"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/overzoom"]

[[tool.mypy.overrides]]
module = ["pmtiles.*", "skimage.*", "spandrel.*", "lpips.*", "huggingface_hub.*", "pyarrow.*", "torch.*", "ipywidgets.*"]
ignore_missing_imports = true

# pmtiles and scikit-image ship no annotations: calling them is allowed, what comes back is cast at the boundary.
[[tool.mypy.overrides]]
module = ["overzoom.archives", "overzoom.metrics", "overzoom.view"]
disallow_untyped_calls = false

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
