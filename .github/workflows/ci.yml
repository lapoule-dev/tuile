name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request supersedes the run of the previous one: that
# run is cancelled rather than left holding runners (macOS runners are few,
# and a stack of pull requests pushes them all at once). Runs on main are
# never cancelled: each merge is tested.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # No assistant attribution in the history: every commit of a pull request
  # goes through the same check as the local hook (`.githooks/commit-msg`).
  commit-messages:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse commits that carry an assistant attribution
        run: |
          status=0
          for c in $(git rev-list ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            git log -1 --format=%B "$c" > "$RUNNER_TEMP/msg"
            if ! sh .githooks/commit-msg "$RUNNER_TEMP/msg"; then
              echo "::error::commit $c carries an assistant attribution"
              status=1
            fi
          done
          exit $status

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # The oldest compiler the workspace says it builds with (`rust-version`),
  # pinned to a patch release: every other job runs on stable, so nothing
  # else would notice a newer language feature creeping in.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # The whole suite, on Linux, in three runners at once. Each test runs in
  # its own process under nextest, and the slowest start first
  # (`.config/nextest.toml`).
  #
  # One test, `the_limb_never_blinks_on_a_slow_way_out`, is a quarter of an
  # hour of lavapipe on its own, and the rest of its binary as much again:
  # each gets a runner, which builds that one binary only. The third runner
  # builds the whole workspace and runs everything else — the filters are
  # each other's complement, so a test renamed or added still runs somewhere.
  test:
    name: test (ubuntu-24.04, ${{ matrix.shard.name }})
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: limb
            scope: -p tuile-wgpu --test sky_flicker
            filter: test(=the_limb_never_blinks_on_a_slow_way_out)
          - name: sky-flicker
            scope: -p tuile-wgpu --test sky_flicker
            filter: not test(=the_limb_never_blinks_on_a_slow_way_out)
          - name: workspace
            scope: --workspace
            filter: not binary_id(tuile-wgpu::sky_flicker)
            doc: true
    # Pinned, not `ubuntu-latest`: the GPU tests render through lavapipe,
    # so the Linux image is also the Vulkan driver. On 2026-10-25
    # `ubuntu-latest` moved from ubuntu-24.04 (Mesa 25.2.8) to
    # ubuntu-26.04 (Mesa 26.0.8), whose lavapipe dies with SIGSEGV in
    # `tuile-film-gpu`'s headless and atmosphere tests. Moving the image
    # is a deliberate change, made here with the driver it brings.
    runs-on: ubuntu-24.04
    env:
      # A GPU test that finds no adapter fails instead of passing empty.
      TUILE_REQUIRE_GPU: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # The key the single `test` job had: main's cache keeps serving.
          shared-key: test
          # The workspace runner builds a superset of the other two.
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.shard.name == 'workspace' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.148
      # Software Vulkan rasterizer so the headless wgpu render tests run on
      # Linux CI. The tray icon needs no system library: it speaks D-Bus.
      - run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1
      - run: cargo nextest run --profile ci ${{ matrix.shard.scope }} -E '${{ matrix.shard.filter }}'
      # nextest does not run doc-tests.
      - if: matrix.shard.doc
        run: cargo test --workspace --doc

  # On macOS, the tests whose outcome can depend on the platform, and only
  # those; everything else runs on Linux only. Kept here:
  #   - the GPU backends and what draws through them — every crate that links
  #     wgpu or a GPU backend crate directly: tuile-wgpu, tuile-film-gpu,
  #     tuile-film-native, tuile-atmosphere, tuile-bevy and its viewer,
  #     tuile-viewer, tuile-record, globe-bulk, orbit-probe (Metal here,
  #     lavapipe on Linux; naga writes MSL here, SPIR-V there);
  #   - what has macOS code: tuile-viewer-bundle (the .app), tuile-record and
  #     tuile-viewer (cfg(target_os = "macos") paths);
  #   - what reads the OS underneath: tuile-storage-foyer (foyer's disk
  #     engine), tuile-native-fetchers (disk cache, TLS through aws-lc),
  #     tuile-farm (processes, unix permissions), tuile-bake (memory read
  #     from cgroup and /proc on Linux, from neither here; thread counts),
  #     tuile-hydra (the C ABI).
  # The whole workspace is still *built* here, every test target included,
  # as `cargo test` built it, so code that only compiles on macOS is checked.
  test-macos:
    runs-on: macos-latest
    env:
      TUILE_REQUIRE_GPU: 1
      MACOS_TESTS: >-
        package(tuile-wgpu) | package(tuile-film-gpu) | package(tuile-film-native)
        | package(tuile-atmosphere) | package(tuile-bevy) | package(tuile-bevy-viewer)
        | package(tuile-viewer) | package(tuile-viewer-bundle) | package(tuile-record)
        | package(tuile-globe-bulk) | package(tuile-orbit-probe)
        | package(tuile-storage-foyer) | package(tuile-native-fetchers) | package(tuile-farm)
        | package(tuile-bake) | package(tuile-hydra)
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.148
      - run: cargo nextest run --profile ci --workspace -E "$MACOS_TESTS"
      - run: >-
          cargo test --doc
          -p tuile-wgpu -p tuile-film-gpu -p tuile-film-native -p tuile-atmosphere
          -p tuile-bevy -p tuile-viewer -p tuile-record
          -p tuile-storage-foyer -p tuile-native-fetchers -p tuile-farm
          -p tuile-bake -p tuile-hydra

  # The graphics budget's simulation and properties, in release: the
  # scenarios are too slow unoptimised (they are ignored in debug builds),
  # and the properties run at 10 000 cases here. The golden decision digests
  # are checked on Linux as on the Mac that recorded them.
  budget-sim:
    runs-on: ubuntu-latest
    env:
      PROPTEST_CASES: 10000
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The budget is its own crate, `tuile-budget`; the imagery tests drive it
      # through the core's traversal and stay in `tuile-core`.
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.148
      # nextest, so the properties and the simulation run side by side rather
      # than one binary after the other.
      - run: cargo nextest run --profile ci --cargo-profile release -p tuile-budget --test budget_sim --test budget_properties --test budget_core --test budget_signals
      - run: cargo nextest run --profile ci --cargo-profile release -p tuile-core --test budget_imagery

  wasm-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Every crate that claims wasm, not only the core. `tuile-web` is
      # entirely gated on wasm32, so no native build ever compiled it: it
      # stopped building in August and nothing said so until October.
      # `-D warnings` because a warning only seen on wasm is seen by nobody.
      - name: cargo check (wasm32, -D warnings)
        env:
          RUSTFLAGS: -D warnings
        run: >-
          cargo check --target wasm32-unknown-unknown
          -p tuile-budget
          -p tuile-ground
          -p tuile-core
          -p tuile-web
          -p tuile-wgpu
          -p tuile-planetary
          -p tuile-terrain
          -p tuile-camera
          -p tuile-atmosphere
          -p tuile-film-gpu
          -p tuile-ui
          -p tuile-film
          -p tuile-bevy
      # The viewer's web shell, its transport and its renderer, as the
      # browser builds them: no native build ever compiles that code.
      - run: cargo clippy --target wasm32-unknown-unknown -p tuile-viewer -p tuile-web -p tuile-wgpu -p tuile-bevy -- -D warnings
      # The Bevy viewer's page, in each of its two builds: Bevy compiles for
      # WebGPU or for WebGL2, never both.
      - run: cargo clippy --target wasm32-unknown-unknown -p tuile-bevy-viewer --features webgpu -- -D warnings
      - run: cargo clippy --target wasm32-unknown-unknown -p tuile-bevy-viewer --features webgl2 -- -D warnings

  # The package a page imports: the wasm build and its bindings, the
  # typings checked by tsc, and a bundler that ships the worker and the wasm.
  web-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: wasm-bindgen at the locked version
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)
          cargo install wasm-bindgen-cli --version "$version" --locked
      - run: packages/tuile-viewer/build.sh --dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: examples/web-viewer-vite
        run: |
          npm install --no-audit --no-fund
          npm run build

  # The Android shell, as the device builds it: no host build ever compiles
  # that code. Clippy on the target, then the APK through the same script a
  # developer runs — the runner image carries the SDK and the NDK.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: cargo install cargo-ndk --locked
      - name: cargo clippy (aarch64-linux-android, -D warnings)
        run: >-
          ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t arm64-v8a --platform 26
          clippy -p tuile-viewer -p tuile-wgpu-viewer -- -D warnings
      - name: the APK
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" crates/tuile-viewer/android/build.sh

  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --workspace --no-deps
