name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # No assistant attribution in the history: every commit of a pull request
  # goes through the same check as the local hook (`.githooks/commit-msg`).
  commit-messages:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse commits that carry an assistant attribution
        run: |
          status=0
          for c in $(git rev-list ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            git log -1 --format=%B "$c" > "$RUNNER_TEMP/msg"
            if ! sh .githooks/commit-msg "$RUNNER_TEMP/msg"; then
              echo "::error::commit $c carries an assistant attribution"
              status=1
            fi
          done
          exit $status

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # The oldest compiler the workspace says it builds with (`rust-version`),
  # pinned to a patch release: every other job runs on stable, so nothing
  # else would notice a newer language feature creeping in.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      # One platform's failure must not cancel the other's report.
      fail-fast: false
      matrix:
        # Pinned, not `ubuntu-latest`: the GPU tests render through lavapipe,
        # so the Linux image is also the Vulkan driver. On 2026-10-25
        # `ubuntu-latest` moved from ubuntu-24.04 (Mesa 25.2.8) to
        # ubuntu-26.04 (Mesa 26.0.8), whose lavapipe dies with SIGSEGV in
        # `tuile-film-gpu`'s headless and atmosphere tests. Moving the image
        # is a deliberate change, made here with the driver it brings.
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Software Vulkan rasterizer so the headless wgpu render tests run on
      # Linux CI. The tray icon needs no system library: it speaks D-Bus.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1
      - run: cargo test --workspace

  # The graphics budget's simulation and properties, in release: the
  # scenarios are too slow unoptimised (they are ignored in debug builds),
  # and the properties run at 10 000 cases here. The golden decision digests
  # are checked on Linux as on the Mac that recorded them.
  budget-sim:
    runs-on: ubuntu-latest
    env:
      PROPTEST_CASES: 10000
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The budget is its own crate, `tuile-budget`; the imagery tests drive it
      # through the core's traversal and stay in `tuile-core`.
      - run: cargo test --release --no-fail-fast -p tuile-budget --test budget_sim --test budget_properties --test budget_core --test budget_signals
      - run: cargo test --release --no-fail-fast -p tuile-core --test budget_imagery

  wasm-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Every crate that claims wasm, not only the core. `tuile-web` is
      # entirely gated on wasm32, so no native build ever compiled it: it
      # stopped building in August and nothing said so until October.
      # `-D warnings` because a warning only seen on wasm is seen by nobody.
      - name: cargo check (wasm32, -D warnings)
        env:
          RUSTFLAGS: -D warnings
        run: >-
          cargo check --target wasm32-unknown-unknown
          -p tuile-budget
          -p tuile-ground
          -p tuile-core
          -p tuile-web
          -p tuile-wgpu
          -p tuile-planetary
          -p tuile-terrain
          -p tuile-camera
          -p tuile-atmosphere
          -p tuile-film-gpu
          -p tuile-ui
          -p tuile-film
          -p tuile-bevy
      # The viewer's web shell, its transport and its renderer, as the
      # browser builds them: no native build ever compiles that code.
      - run: cargo clippy --target wasm32-unknown-unknown -p tuile-viewer -p tuile-web -p tuile-wgpu -p tuile-bevy -- -D warnings
      # The Bevy viewer's page, in each of its two builds: Bevy compiles for
      # WebGPU or for WebGL2, never both.
      - run: cargo clippy --target wasm32-unknown-unknown -p tuile-bevy-viewer --features webgpu -- -D warnings
      - run: cargo clippy --target wasm32-unknown-unknown -p tuile-bevy-viewer --features webgl2 -- -D warnings

  # The package a page imports: the wasm build and its bindings, the
  # typings checked by tsc, and a bundler that ships the worker and the wasm.
  web-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: wasm-bindgen at the locked version
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)
          cargo install wasm-bindgen-cli --version "$version" --locked
      - run: packages/tuile-viewer/build.sh --dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: examples/web-viewer-vite
        run: |
          npm install --no-audit --no-fund
          npm run build

  # The Android shell, as the device builds it: no host build ever compiles
  # that code. Clippy on the target, then the APK through the same script a
  # developer runs — the runner image carries the SDK and the NDK.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: cargo install cargo-ndk --locked
      - name: cargo clippy (aarch64-linux-android, -D warnings)
        run: >-
          ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t arm64-v8a --platform 26
          clippy -p tuile-viewer -p tuile-wgpu-viewer -- -D warnings
      - name: the APK
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" crates/tuile-viewer/android/build.sh

  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps
