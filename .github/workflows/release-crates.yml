#
# The library crates, published to crates.io from a release tag.
#
# Off until Laurent turns it on: the publish job runs only when the
# repository variable CRATES_IO_PUBLISH is "true" (Settings → Secrets and
# variables → Actions → Variables). That is a setting of the repository, not
# of the code; unset, a tag publishes nothing. The token is the secret
# CARGO_REGISTRY_TOKEN. See docs/releasing.md for what still stands in the
# way (git dependencies) and the order the crates go out in.
#
# `cargo publish --workspace` (stable since cargo 1.90) packages every crate
# whose manifest does not say `publish = false`, verifies each one against the
# others as they will be on the registry, and then uploads them in the order
# of the dependency graph, waiting for each to be in the index before the
# next. Nothing is uploaded if any crate fails to package.
#
# `workflow_dispatch` is a dry run: the same packaging and verification, no
# upload, whatever the variable says.
name: Release crates

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-crates
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  crates:
    if: github.event_name == 'workflow_dispatch' || vars.CRATES_IO_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-crates
      - name: The tag is the workspace version
        if: github.event_name == 'push'
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"])')"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $version"
            exit 1
          fi
      - name: Dry run
        if: github.event_name == 'workflow_dispatch'
        run: cargo publish --workspace --locked --dry-run
      - name: Publish
        if: github.event_name == 'push'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [[ -z "$CARGO_REGISTRY_TOKEN" ]]; then
            echo "::error::CRATES_IO_PUBLISH is true but CARGO_REGISTRY_TOKEN is not set"
            exit 1
          fi
          cargo publish --workspace --locked
