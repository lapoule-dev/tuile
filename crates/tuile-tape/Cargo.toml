[package]
name = "tuile-tape"
description = "Record a camera path and fly it again, exactly. MCAP on disk."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
# For `geo::geodetic_to_ecef`. A tape places a camera on the Earth, and
# placing it on a sphere instead of the ellipsoid put one 14.8 km above the
# ground it was meant to be 5 km above.
tuile-core = { version = "0.14.0", path = "../tuile-core" }
glam = { workspace = true }
# A time-lapse's camera is built as every globe camera is.
tuile-camera = { version = "0.14.0", path = "../tuile-camera" }
# A time-lapse's start, as a calendar says it.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# Without its compressors in a browser: they are C, and a wasm32 module has no
# C library to link them against. Everywhere else, as it always was.
mcap = { version = "0.25", default-features = false }
# Catmull–Rom, plutôt qu'écrit à la main.
#
# La construction — points de contrôle au tiers de la corde des voisins — tient
# en six lignes, et c'est exactement pour ça qu'on la recopie mal : elle est
# assez simple pour qu'on croie la connaître, et assez subtile pour que le
# raccord de la couture d'une boucle soit faux sans que ça se voie sur une
# figure. BSD-3-Clause, un million de téléchargements.
splines = "5.0"
image = { workspace = true }
# The session's records beside the camera (`session`): typed, versioned, and
# every `f64` read back to the bit — hence `float_roundtrip`, without which a
# wall time or an instant may come back one unit in the last place off.
serde = { workspace = true }
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mcap = "0.25"
