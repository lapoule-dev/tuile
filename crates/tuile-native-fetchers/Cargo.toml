[package]
name = "tuile-native-fetchers"
description = "Native HTTP fetchers for tuile: pooled reqwest client + browser-style disk & in-memory cache, implementing the core fetch seams"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
reqwest = { workspace = true }
# `time` for the retry backoff sleeps.
tokio = { workspace = true, features = ["fs", "time"] }
tracing = { workspace = true }
url = { workspace = true }
tuile-core = { version = "0.15.1", path = "../tuile-core" }
tuile-cesium-ion = { version = "0.15.1", path = "../tuile-cesium-ion" }
thiserror = { workspace = true }
reqwest-middleware = { workspace = true }
http-cache-reqwest = { workspace = true }
http-cache = { workspace = true }
foyer = { workspace = true }
# The tiles' fetches by source, as the tile store records its own.
metrics = "0.24"

[dev-dependencies]
# Counters and histograms read back in the tests, from a recorder of the
# test's own thread.
metrics-util = { version = "0.20", default-features = false, features = ["debugging"] }
tempfile = { workspace = true }
# Constructing the middleware error the cache layer actually produces, and a
# real transport error to hide inside it.
anyhow = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "net", "io-util"] }
