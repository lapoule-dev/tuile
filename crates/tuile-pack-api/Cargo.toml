[package]
name = "tuile-pack-api"
description = "A local, read-only HTTP API over the buckets a film is made from: packs, camera tapes, source tiles"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
axum = "0.8"
dotenvy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
tokio = { workspace = true, features = ["fs", "io-util", "sync", "net"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "set-header"] }
tuile-repository = { version = "0.1.0", path = "../tuile-repository" }
tuile-tile-server = { path = "../tuile-tile-server" }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tuile-farm = { version = "0.1.0", path = "../tuile-farm" }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
