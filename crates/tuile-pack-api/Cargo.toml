[package]
name = "tuile-pack-api"
description = "A local, read-only HTTP API over the buckets a film is made from: packs, camera tapes, source tiles"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
async-trait = { workspace = true }
axum = "0.8"
bytes = { workspace = true }
dotenvy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
tokio = { workspace = true, features = ["fs", "io-util", "sync", "net"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "set-header"] }
# The contract of a store of bytes, which what packs hold is remembered in.
tuile-core = { version = "0.3.1", path = "../tuile-core" }
tuile-repository = { version = "0.3.1", path = "../tuile-repository" }
tuile-tile-server = { path = "../tuile-tile-server" }
# Where a remote store's blocks are kept once read.
tuile-storage-foyer = { version = "0.3.1", path = "../tuile-storage-foyer" }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tuile-farm = { version = "0.3.1", path = "../tuile-farm" }

[dev-dependencies]
image = { workspace = true }
tempfile = { workspace = true }
tuile-film = { version = "0.3.1", path = "../tuile-film" }
tuile-radiometry = { version = "0.3.1", path = "../tuile-radiometry" }

[lints]
workspace = true
