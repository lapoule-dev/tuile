[package]
name = "tuile-web"
version.workspace = true
description = "Browser transport for tuile-core: fetch, and the streaming protocol over postMessage"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
futures-channel = { workspace = true }
futures-util = { workspace = true }
glam = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
# The decode pool's timings: `performance.now()` in a browser.
web-time = { workspace = true }

tuile-core = { version = "0.15.1", path = "../tuile-core" }
tuile-cesium-ion = { version = "0.15.1", path = "../tuile-cesium-ion" }

# The browser is the only target this crate has: everything below exists solely
# there, and building it for a native host would produce a library that cannot
# do anything. Gated rather than optional so a `--workspace` build on a laptop
# skips it instead of failing on a missing `window`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.99"
wasm-bindgen-futures = "0.4.49"
js-sys = "0.3.76"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3.76"
features = [
    "AbortController",
    "AbortSignal",
    "DedicatedWorkerGlobalScope",
    "Event",
    "Headers",
    "MessageEvent",
    "Navigator",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Window",
    "Worker",
    "WorkerGlobalScope",
    "WorkerNavigator",
]

