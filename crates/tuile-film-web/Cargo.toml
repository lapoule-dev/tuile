[package]
name = "tuile-film-web"
description = "Renders a pre-baked film in a browser worker: WebGPU through wgpu, frames handed to WebCodecs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tuile-film = { version = "0.1.0", path = "../tuile-film" }
tuile-mp4 = { version = "0.1.0", path = "../tuile-mp4" }

# The browser is the only target: everything below exists solely there, and a
# `--workspace` build on a laptop skips it instead of failing on a missing
# worker scope — the same arrangement as `tuile-web`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-util = { workspace = true }
tuile-film-gpu = { version = "0.1.0", path = "../tuile-film-gpu" }
wgpu = { workspace = true, features = ["webgpu"] }
wasm-bindgen = "0.2.99"
wasm-bindgen-futures = "0.4.49"
js-sys = "0.3.76"
console_error_panic_hook = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3.76"
features = [
    "Blob",
    "BlobPropertyBag",
    "ColorSpaceConversion",
    "ImageBitmap",
    "ImageBitmapOptions",
    "OffscreenCanvas",
    "Performance",
    "PremultiplyAlpha",
    "WorkerGlobalScope",
]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-O', '--enable-bulk-memory', '--enable-nontrapping-float-to-int', '--enable-sign-ext']

[lints]
workspace = true
