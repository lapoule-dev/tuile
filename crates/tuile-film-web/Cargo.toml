[package]
name = "tuile-film-web"
description = "Renders a pre-baked film in a browser worker: WebGPU through wgpu, frames handed to WebCodecs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tuile-core = { version = "0.3.1", path = "../tuile-core" }
tuile-film = { version = "0.3.1", path = "../tuile-film" }
tuile-mp4 = { version = "0.3.1", path = "../tuile-mp4" }

# The browser is the only target: everything below exists solely there, and a
# `--workspace` build on a laptop skips it instead of failing on a missing
# worker scope — the same arrangement as `tuile-web`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-channel = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The fallback encoder: pure Rust, so it builds for wasm32 as it is. No
# assembly, no threads — the workers are the parallelism.
rav1e = { version = "0.8", default-features = false }
tuile-repository = { version = "0.3.1", path = "../tuile-repository" }
tuile-film-gpu = { version = "0.3.1", path = "../tuile-film-gpu" }
tuile-radiometry = { version = "0.3.1", path = "../tuile-radiometry" }
wgpu = { workspace = true, features = ["webgpu"] }
wasm-bindgen = "0.2.99"
wasm-bindgen-futures = "0.4.49"
js-sys = "0.3.76"
console_error_panic_hook = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3.76"
features = [
    "Blob",
    "BlobPropertyBag",
    "CanvasRenderingContext2d",
    "ColorSpaceConversion",
    "CssStyleDeclaration",
    "DedicatedWorkerGlobalScope",
    "Document",
    "DomRect",
    "DomTokenList",
    "Element",
    "Event",
    "EventTarget",
    "Headers",
    "History",
    "HtmlAnchorElement",
    "HtmlButtonElement",
    "HtmlCanvasElement",
    "HtmlCollection",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlMediaElement",
    "HtmlOptionElement",
    "HtmlOptionsCollection",
    "HtmlProgressElement",
    "HtmlSelectElement",
    "ImageBitmap",
    "ImageBitmapOptions",
    "Location",
    "MessageEvent",
    "MouseEvent",
    "Navigator",
    "Node",
    "NodeList",
    "OffscreenCanvas",
    "Performance",
    "PremultiplyAlpha",
    "Request",
    "RequestInit",
    "Response",
    "Text",
    "Url",
    "UrlSearchParams",
    "Window",
    "Worker",
    "WorkerGlobalScope",
    "WorkerOptions",
    "WorkerType",
]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-O', '--enable-bulk-memory', '--enable-nontrapping-float-to-int', '--enable-sign-ext']

[lints]
workspace = true
