[package]
name = "tuile-cesium-ion"
description = "Cesium ion source connector for tuile: asset endpoint resolution, bearer tokens, 3D Tiles and imagery transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
roxmltree = { workspace = true }
tracing = { workspace = true }
flate2 = { workspace = true }
thiserror = { workspace = true }
tuile-bing = { version = "0.15.1", path = "../tuile-bing" }
tuile-core = { version = "0.15.1", path = "../tuile-core" }
# `Sources`, which `IonSources` implements: the seam a globe is assembled on.
tuile-planetary = { version = "0.15.1", path = "../tuile-planetary" }
tuile-terrain = { version = "0.15.1", path = "../tuile-terrain" }
url = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true, optional = true, features = ["gzip"] }
# The catalog proxy's server: the web framework the workspace's other services
# use, and its CORS layer.
axum = { version = "0.8", optional = true }
tower-http = { version = "0.6", optional = true, features = ["cors"] }

[dev-dependencies]
futures-executor = { workspace = true }
image = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true }
tower = { version = "0.5", features = ["util"] }

[features]
default = []
reqwest = ["dep:reqwest"]
# The catalog proxy on axum: see `proxy`.
proxy = ["reqwest", "dep:axum", "dep:tower-http"]
