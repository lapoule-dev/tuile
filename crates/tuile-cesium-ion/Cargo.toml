[package]
name = "tuile-cesium-ion"
description = "Cesium ion source connector for tuile: asset endpoint resolution, bearer tokens, 3D Tiles and imagery transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
roxmltree = { workspace = true }
tracing = { workspace = true }
flate2 = { workspace = true }
thiserror = { workspace = true }
tuile-core = { version = "0.0.1", path = "../tuile-core" }
tuile-terrain = { version = "0.0.1", path = "../tuile-terrain" }
url = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true, optional = true, features = ["gzip"] }

[dev-dependencies]
futures-executor = { workspace = true }
image = { workspace = true }

[features]
default = []
reqwest = ["dep:reqwest"]
