[package]
name = "tuile-cesium-ion"
description = "Cesium ion source connector for tuile: asset endpoint resolution, bearer tokens, 3D Tiles and imagery transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tuile-core = { version = "0.0.1", path = "../tuile-core" }
url = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", optional = true, default-features = false, features = ["rustls-tls", "http2"] }

[dev-dependencies]
futures-executor = "0.3"

[features]
default = []
reqwest = ["dep:reqwest"]
