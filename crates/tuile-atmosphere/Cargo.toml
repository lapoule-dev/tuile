[package]
name = "tuile-atmosphere"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Sun position, aerial perspective and sky for a rendered globe — renderer-agnostic"

[dependencies]
glam.workspace = true
# Only so the uniform structs can cross to a GPU buffer without a backend having
# to restate their layout — a restatement is exactly the drift this crate exists
# to prevent. bytemuck is plain-data plumbing, not a renderer.
bytemuck.workspace = true
tuile-core = { version = "0.15.1", path = "../tuile-core" }
solar-positioning.workspace = true
astro.workspace = true
# The tables, the sky-view and the uniform on a GPU, shared by every wgpu
# renderer that draws this air — the film's and the viewer's — so that they
# hold one implementation and not two. Optional: the physics needs no GPU.
wgpu = { workspace = true, optional = true }

[features]
wgpu = ["dep:wgpu"]

[dev-dependencies]
pollster.workspace = true
