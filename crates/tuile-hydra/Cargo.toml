[package]
name = "tuile-hydra"
description = "C ABI over the tuile geometry server, for an OpenUSD/Hydra plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

# A static library the C++ plugin links, plus an rlib so the Rust tests can
# exercise the same code without going through the FFI.
[lib]
crate-type = ["staticlib", "rlib"]

# Deliberately NOT `[lints] workspace = true`. The workspace denies unsafe code,
# which is right everywhere else and impossible here: an `extern "C"` boundary is
# unsafe by construction. The exception is narrow and lives only in this crate.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
unwrap_used = "warn"
panic = "warn"

[dependencies]
glam = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tuile-core = { version = "0.1.0", path = "../tuile-core" }
# Le travail : session, globe, traversée, lecture de pack. Rien d'OpenUSD
# là-dedans, et c'est exactement pourquoi il est ailleurs — voir lib.rs.
tuile-bake = { version = "0.1.0", path = "../tuile-bake" }
# Le conteneur pré-cuit, pour les types que l'ABI expose.
tuile-pack = { version = "0.1.0", path = "../tuile-pack" }

[dev-dependencies]
tempfile = { workspace = true }
