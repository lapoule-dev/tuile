[package]
name = "tuile-hydra"
description = "C ABI over the tuile geometry server, for an OpenUSD/Hydra plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

# A static library the C++ plugin links, plus an rlib so the Rust tests can
# exercise the same code without going through the FFI.
[lib]
crate-type = ["staticlib", "rlib"]

# Deliberately NOT `[lints] workspace = true`. The workspace denies unsafe code,
# which is right everywhere else and impossible here: an `extern "C"` boundary is
# unsafe by construction. The exception is narrow and lives only in this crate.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
unwrap_used = "warn"
panic = "warn"

[dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
glam = { workspace = true }
image = { workspace = true }
# `time` for the frame deadline: a bulk frame blocks, and an unbounded block
# on a farm node is indistinguishable from a hang.
tokio = { workspace = true, features = ["time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
tuile-core = { version = "0.0.1", path = "../tuile-core" }
# The host is OpenUSD, which has no way to resolve tile sources for itself: a
# C++ plugin cannot call `tuile_planetary::globe`. So this facade — specialised
# for its host, per docs/01-architecture.md — assembles the globe behind the
# boundary. That is why a crate whose session is source-agnostic nonetheless
# depends on ion, Bing and a native transport.
tuile-cesium-ion = { version = "0.0.1", path = "../tuile-cesium-ion" }
tuile-bing = { version = "0.0.1", path = "../tuile-bing" }
tuile-planetary = { version = "0.0.1", path = "../tuile-planetary" }
tuile-native-fetchers = { version = "0.0.1", path = "../tuile-native-fetchers" }

[dev-dependencies]
tempfile = { workspace = true }
