[package]
name = "tuile-usd"
description = "The manifest stage: a recorded camera path plus a Globe prim, as plain .usda text."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
tuile-tape = { path = "../tuile-tape" }
# For `geo::ecef_to_geodetic`. The clipping range is derived from the camera's
# height, and deriving that from a sphere put the near plane at 0.5 m.
tuile-core = { version = "0.1.0", path = "../tuile-core" }
glam = { workspace = true }

[lints]
workspace = true
