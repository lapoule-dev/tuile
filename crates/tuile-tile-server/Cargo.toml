[package]
name = "tuile-tile-server"
description = "Source tiles kept once: PMTiles archives per zone and per layer on object storage, written in memory, compacted in stream"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
# Test data stays in the repository: the tests that read it run there.
exclude = ["tests/fixtures/"]

[lints]
workspace = true

[dependencies]
# The archive format. Only what a server reads and writes: the object-store
# backend (same `object_store` as tuile-farm), a local file for compaction,
# the writer, and the entry stream a merge walks. No HTTP client, no S3 SDK.
pmtiles = { version = "0.24", default-features = false, features = ["object-store", "mmap-async-tokio", "write", "iter-async"] }
object_store = { version = "0.14.2", default-features = false }
async-trait = { workspace = true }
bytes = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = { workspace = true }
# An index records each image tile's size, read from its header alone.
image = { workspace = true, features = ["webp"] }
metrics = "0.24"
# What a process keeps of the immutable archives it reads through its
# tiers: byte-weighted caches whose loads are single flight.
moka = { version = "0.12", features = ["future"] }
rand = "0.9"
serde = { workspace = true }
serde_json = { workspace = true }
# A shared projection's key: a digest of the archives it was made from.
sha2 = "0.11"
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "fs", "io-util", "time", "rt"] }
tracing = { workspace = true }
tuile-core = { version = "0.17.1", path = "../tuile-core" }
# What a source sends for "no imagery" (`index::is_empty_tile`).
tuile-bing = { version = "0.17.1", path = "../tuile-bing" }
url = { workspace = true }
# A parent layer's tiles (`derived`), encoded by libwebp — the reference
# encoder, built from its C sources (no system library): lossy WebP, which
# image's own encoder does not write.
webp = { version = "0.3", default-features = false }

[dev-dependencies]
# Counters read back in the tests, from a recorder of the test's own thread.
metrics-util = { version = "0.20", default-features = false, features = ["debugging"] }
# The integration test talks to a real S3-compatible bucket (R2).
object_store = { version = "0.14.2", default-features = false, features = ["aws"] }
tokio = { workspace = true, features = ["sync", "fs", "io-util", "time", "rt", "rt-multi-thread", "macros"] }
