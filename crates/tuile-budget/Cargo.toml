[package]
name = "tuile-budget"
description = "The graphics budget: pure, deterministic decisions of what is loaded, uploaded, drawn and evicted"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

# At the bottom of the graph: no other tuile crate, no GPU API, no async
# runtime, no I/O. It builds for `wasm32-unknown-unknown`.
[dependencies]
thiserror = { workspace = true }
# The arena's index: resource → slot, a fixed-seed hash table never iterated
# (`state::Arena`).
hashbrown = { workspace = true }
foldhash = { workspace = true }
# The kept maps (`sorted::SortedMap`): a B-tree of order 16 whose nodes
# live in a slab grown by eighths, so a change costs its path in the tree
# (never a shift of the entries after it) and a node freed is the next one
# taken (nothing allocated once the maps have grown). Pre-1.0 in the wasm
# path (rule 8): see `sorted.rs`.
#
# lapoule-dev's fork, pinned: 0.6.1's `range` runs off the tree when a bound
# is not a key of it (and steps `next_back` from the wrong end), and its
# `retain` stops early; both fixed there, with random tests against the
# standard map; the order and the slab's growth are the fork's too. A git
# dependency: crates.io refuses it, so `tuile-budget` cannot be published
# there until upstream releases the fixes (docs/releasing.md).
btree-slab = { git = "https://github.com/lapoule-dev/btree-slab", rev = "0d1412cc9623231a7b90807d2c716d01cffa04b1", features = ["order-16"] }

[dev-dependencies]
# The budget's properties (protection, total order, ledger, determinism,
# cancellation) over random need and arrival sequences.
proptest = { workspace = true }
# What one budget `decide` costs, mean and percentiles (`benches/budget_decide.rs`).
criterion = { workspace = true }

[[bench]]
name = "budget_decide"
harness = false
