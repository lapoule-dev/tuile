[package]
name = "tuile-repository"
description = "Where films live: repositories over the buckets that hold packs, camera tapes and source tiles"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

# The contracts and the key layouts: everything a reader of the buckets needs
# to know, and nothing that ties it to one way of reaching them. This half
# compiles to wasm32, so a Worker reads the same layouts through its own
# `Objects` over an R2 binding.
[dependencies]
# Numbers only, no dependency of its own: the grades a store keeps.
tuile-radiometry = { version = "0.3.1", path = "../tuile-radiometry" }
# The contract of a store of bytes, which what is kept here is kept in.
tuile-core = { version = "0.3.1", path = "../tuile-core" }
async-trait = { workspace = true }
bytes = { workspace = true }
# PMTiles directories are gzipped; pure Rust, so it builds for a Worker.
flate2 = { workspace = true }
futures-util = { workspace = true }
percent-encoding = "2"
# The archive format only — header, directories, tile ids. Its readers are
# tokio's; the reading here goes through `Objects`.
pmtiles = { version = "0.24", default-features = false }
roxmltree = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# For signing S3 requests where there is no S3 client: a Worker.
sha2 = "0.11"
thiserror = { workspace = true }
toml = "0.8"
tuile-pack = { version = "0.3.1", path = "../tuile-pack" }

# The native adapters: an S3 bucket or a directory, the on-disk chunk cache,
# the tile store.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# A tile store served by someone else is asked over HTTP.
reqwest = { workspace = true }
tokio = { workspace = true, features = ["fs", "time"] }
tracing = { workspace = true }
tuile-farm = { version = "0.3.1", path = "../tuile-farm" }
tuile-tile-server = { path = "../tuile-tile-server" }

[dev-dependencies]
bytes = { workspace = true }
object_store = { version = "0.14.2", default-features = false }
futures-executor = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
