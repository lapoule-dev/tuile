[package]
name = "tuile-wgpu"
description = "Reference wgpu render backend for tuile-core (native + wasm)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
bytemuck = { workspace = true }
futures-util = { workspace = true }
glam = { workspace = true }
thiserror = { workspace = true }
tuile-atmosphere = { version = "0.15.1", path = "../tuile-atmosphere", features = ["wgpu"] }
tuile-core = { version = "0.15.1", path = "../tuile-core" }
# The shapes a host hands over, their vertex packing and the light they share
# with the film: data and WGSL text, no GPU of its own.
tuile-overlay = { version = "0.15.1", path = "../tuile-overlay" }
# The GPU block encoder (feature `gpu`, the workspace's wgpu), used only when
# the consumer chose compression.
texcomp = { workspace = true, features = ["gpu"] }
wgpu = { workspace = true }
web-time = { workspace = true }

[dev-dependencies]
# The shader translator wgpu itself uses, at its version: the WebGL2 test
# writes every shader out as GLSL ES 3.00 the way the GL backend would.
naga = { version = "30.0.1", features = ["wgsl-in", "glsl-out"] }
futures-executor = { workspace = true }
futures-util = { workspace = true }
glam = { workspace = true }
image = { workspace = true }
pollster = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tuile-atmosphere = { path = "../tuile-atmosphere" }
tuile-core = { path = "../tuile-core" }
tuile-terrain = { path = "../tuile-terrain" }
tuile-planetary = { path = "../tuile-planetary" }
# The flights of `tests/sky_flicker.rs` traced to MCAP, as every tape is.
tuile-tape = { path = "../tuile-tape" }
async-trait = { workspace = true }
url = { workspace = true }
