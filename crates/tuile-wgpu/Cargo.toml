[package]
name = "tuile-wgpu"
description = "Reference wgpu render backend for tuile-core (native + wasm)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
bytemuck = { workspace = true }
futures-util = { workspace = true }
glam = { workspace = true }
thiserror = { workspace = true }
tuile-atmosphere = { version = "0.12.0", path = "../tuile-atmosphere" }
tuile-core = { version = "0.12.0", path = "../tuile-core" }
# The shapes a host hands over, their vertex packing and the light they share
# with the film: data and WGSL text, no GPU of its own.
tuile-overlay = { version = "0.12.0", path = "../tuile-overlay" }
wgpu = { workspace = true }
web-time = { workspace = true }

[dev-dependencies]
# The shader translator wgpu itself uses, at its version: the WebGL2 test
# writes every shader out as GLSL ES 3.00 the way the GL backend would.
naga = { version = "29.0.3", features = ["wgsl-in", "glsl-out"] }
futures-executor = { workspace = true }
futures-util = { workspace = true }
glam = { workspace = true }
image = { workspace = true }
pollster = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tuile-atmosphere = { path = "../tuile-atmosphere" }
tuile-core = { path = "../tuile-core" }
tuile-terrain = { path = "../tuile-terrain" }
tuile-planetary = { path = "../tuile-planetary" }
async-trait = { workspace = true }
url = { workspace = true }
