[package]
name = "tuile-film-native"
description = "Renders a film natively from its packs and the tile store, read through one cached repository — and lets instruments watch what goes in and what comes out"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
tempfile = { workspace = true }
async-trait = { workspace = true }
dotenvy = { workspace = true }
futures-util = { workspace = true }
glam = { workspace = true }
image = { workspace = true }
# Pure Rust, any picture size. Without its assembly it is slow; it is the
# encoder a machine has when it has nothing else.
rav1e = { version = "0.8", default-features = false, features = ["threading"] }
tokio = { workspace = true }
# The film's own bake, called by `tuile-film-produce` as a function.
tuile-bake = { version = "0.12.0", path = "../tuile-bake" }
tuile-pack = { version = "0.12.0", path = "../tuile-pack" }
clap = { version = "4.6", features = ["derive"] }
# The render as a service (`tuile-film-serve`): its requests and receipts.
axum = "0.8"
serde = { workspace = true }
serde_json = { workspace = true }
tuile-core = { version = "0.12.0", path = "../tuile-core" }
# The sun of a frame's instant, when a clock is given (`Order::clock`).
tuile-atmosphere = { version = "0.12.0", path = "../tuile-atmosphere" }
# The clock of a time-lapse, as its tape's maker writes it.
tuile-tape = { version = "0.12.0", path = "../tuile-tape" }
tuile-farm = { version = "0.12.0", path = "../tuile-farm" }
tuile-film = { version = "0.12.0", path = "../tuile-film" }
tuile-film-gpu = { version = "0.12.0", path = "../tuile-film-gpu" }
tuile-mp4 = { version = "0.12.0", path = "../tuile-mp4" }
tuile-radiometry = { version = "0.12.0", path = "../tuile-radiometry" }
tuile-repository = { version = "0.12.0", path = "../tuile-repository" }
# Where the store's small objects are kept between two renders.
tuile-storage-foyer = { version = "0.12.0", path = "../tuile-storage-foyer" }
wgpu = { workspace = true }
# A segment's profile, gzipped like any pprof.
flate2 = { workspace = true }

# A segment's CPU sampled while the service makes it (`profile`), written as
# pprof: the prost codec reads its pre-generated types, no protoc needed.
[target.'cfg(unix)'.dependencies]
pprof = { version = "0.15", default-features = false, features = ["prost-codec"] }

# The system's frameworks, for the `videotoolbox` feature.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3.2", optional = true }
objc2-core-media = { version = "0.3.2", optional = true }
objc2-core-video = { version = "0.3.2", optional = true }
objc2-video-toolbox = { version = "0.3.2", optional = true }
# Spatial (MV-HEVC) films, encoded and written by AVFoundation itself.
objc2 = { version = "0.6.4", optional = true }
objc2-foundation = { version = "0.3.2", optional = true }
objc2-av-foundation = { version = "0.3.2", optional = true, features = ["objc2-core-media"] }
block2 = { version = "0.6.2", optional = true }

# NVIDIA's encoder, for the `nvenc` feature.
[target.'cfg(target_os = "linux")'.dependencies]
# lapoule-dev's fork on NVENC API 13 (driver 570 and later): MV-HEVC, the
# two eyes of a spatial film, on the cards that encode it (Blackwell); and
# NVDEC's safe decoder, for the final stage's decode.
nvidia-video-codec-sdk = { git = "https://github.com/lapoule-dev/nvidia-video-codec-sdk", rev = "ee2e29f41b494b75b74d2190b53fcdbcd808cc0b", optional = true }
# The same cudarc the encoder's bindings are built on, for its context. The
# bindings take it with its default features, and features are unified: its
# default `dynamic-loading` is therefore the only linking mode there is to
# choose (asking for `dynamic-linking` beside it stops cudarc's build), and
# CUDA is opened at run time, not linked.
cudarc = { version = "0.16.4", optional = true, features = ["cuda-version-from-build-system"] }

[dev-dependencies]
pollster = { workspace = true }

[features]
# rav1e's own assembly: several times faster, and no longer Rust alone.
asm = ["rav1e/asm"]
# H.264 by the machine's own hardware encoder, through VideoToolbox: macOS
# only, and ignored elsewhere.
videotoolbox = [
    "dep:objc2-core-foundation",
    "dep:objc2-core-media",
    "dep:objc2-core-video",
    "dep:objc2-video-toolbox",
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-av-foundation",
    "dep:block2",
]

# AV1 or H.264 by an NVIDIA card's encoder (NVENC, over CUDA): Linux only,
# and ignored elsewhere.
nvenc = ["dep:nvidia-video-codec-sdk", "dep:cudarc"]

[lints]
workspace = true
