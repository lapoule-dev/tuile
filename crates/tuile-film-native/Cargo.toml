[package]
name = "tuile-film-native"
description = "Renders a film natively from its packs and the tile store, read through one cached repository — and lets instruments watch what goes in and what comes out"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
async-trait = { workspace = true }
dotenvy = { workspace = true }
futures-util = { workspace = true }
image = { workspace = true }
# Pure Rust, any picture size. Without its assembly it is slow; it is the
# encoder a machine has when it has nothing else.
rav1e = { version = "0.8", default-features = false, features = ["threading"] }
tokio = { workspace = true }
tuile-core = { version = "0.2.0", path = "../tuile-core" }
tuile-farm = { version = "0.2.0", path = "../tuile-farm" }
tuile-film = { version = "0.2.0", path = "../tuile-film" }
tuile-film-gpu = { version = "0.2.0", path = "../tuile-film-gpu" }
tuile-mp4 = { version = "0.2.0", path = "../tuile-mp4" }
tuile-radiometry = { version = "0.2.0", path = "../tuile-radiometry" }
tuile-repository = { version = "0.2.0", path = "../tuile-repository" }
wgpu = { workspace = true }

# The system's frameworks, for the `videotoolbox` feature.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3.2", optional = true }
objc2-core-media = { version = "0.3.2", optional = true }
objc2-core-video = { version = "0.3.2", optional = true }
objc2-video-toolbox = { version = "0.3.2", optional = true }

# NVIDIA's encoder, for the `nvenc` feature.
[target.'cfg(target_os = "linux")'.dependencies]
nvidia-video-codec-sdk = { version = "0.4.0", optional = true }
# The same cudarc the encoder's bindings are built on, for its context.
cudarc = { version = "0.16.4", optional = true, default-features = false, features = ["driver", "std", "cuda-version-from-build-system", "dynamic-linking"] }

[dev-dependencies]
tempfile = { workspace = true }

[features]
# rav1e's own assembly: several times faster, and no longer Rust alone.
asm = ["rav1e/asm"]
# H.264 by the machine's own hardware encoder, through VideoToolbox: macOS
# only, and ignored elsewhere.
videotoolbox = [
    "dep:objc2-core-foundation",
    "dep:objc2-core-media",
    "dep:objc2-core-video",
    "dep:objc2-video-toolbox",
]

# AV1 or H.264 by an NVIDIA card's encoder (NVENC, over CUDA): Linux only,
# and ignored elsewhere.
nvenc = ["dep:nvidia-video-codec-sdk", "dep:cudarc"]

[lints]
workspace = true
