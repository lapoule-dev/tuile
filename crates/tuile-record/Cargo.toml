[package]
name = "tuile-record"
description = "A recorded viewer session made readable: its pictures to an mp4, their measures to a Parquet sidecar beside each frame's pose, clock and sky, and the frames that flicker flagged"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

# A tool, never linked by a renderer: Parquet, Arrow and the film's encoders
# stay out of the viewer and of every wasm build.
[dependencies]
arrow-array = "58.4.0"
arrow-schema = "58.4.0"
# Snappy only: pure Rust, no C codec to build.
parquet = { version = "58.4.0", default-features = false, features = ["arrow", "snap"] }
glam = { workspace = true }
tuile-camera = { version = "0.15.0", path = "../tuile-camera" }
tuile-core = { version = "0.15.0", path = "../tuile-core" }
# The instant of a frame, as a link writes it.
tuile-atmosphere = { version = "0.15.0", path = "../tuile-atmosphere" }
# The film's encoders: H.264 by VideoToolbox on a Mac, AV1 by rav1e
# anywhere — the film's own, into an mp4 by tuile-mp4. Never ffmpeg.
tuile-film-native = { version = "0.15.0", path = "../tuile-film-native" }
tuile-tape = { version = "0.15.0", path = "../tuile-tape" }
# The plots, written as PNG.
image = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
tuile-film-native = { version = "0.15.0", path = "../tuile-film-native", features = ["videotoolbox"] }

[dev-dependencies]
tempfile = { workspace = true }
