[package]
name = "tuile-core"
description = "Render-agnostic OGC 3D Tiles engine: parsing, SSE traversal, content decoding, geometry streaming"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
futures-channel = { workspace = true }
futures-core = { workspace = true }
futures-util = { workspace = true }
glam = { workspace = true }
gltf = { workspace = true }
image = { workspace = true }
serde = { workspace = true }
# Imagery stored already compressed (KTX 2.0, UASTC): read, transcoded or
# unpacked on the CPU. Pure Rust, wasm-clean, no GPU dependency.
texcomp = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# A facade, not a backend: with no subscriber installed the macros compile
# down to a check the optimiser removes, and it is wasm-clean. The rule this
# crate lives under is about wgpu, tokio and axum — about anything that would
# decide a consumer's runtime for it — not about being able to say what
# happened. Not optional: a log line that disappears depending on how the
# crate was built is worse than no log line, and the flag bought nothing —
# it was declared and never used.
tracing = { workspace = true }
tuile-b3dm = { version = "0.15.0", path = "../tuile-b3dm" }
url = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true, optional = true }
# Native only, and only when a host asks for it (`rt-tokio`): loads spawned on
# the host's runtime, results through a channel. The default build and the
# wasm build have none — see `runtime::Spawn`.
tokio = { workspace = true, optional = true, features = ["sync"] }

[dev-dependencies]
futures-executor = { workspace = true }
# Proving that the determinism trace really is machine-readable: a JSON
# subscriber is installed in a test and its output parsed back.
tracing-subscriber = { workspace = true }
tempfile = { workspace = true }
# The budget's properties (protection, total order, ledger, determinism,
# cancellation) over random need and arrival sequences.
proptest = { workspace = true }
# What one budget `decide` costs, mean and percentiles (`benches/budget_decide.rs`).
criterion = { workspace = true }

[[bench]]
name = "budget_decide"
harness = false

[features]
default = []
http = ["dep:reqwest"]
# Loads as tokio tasks on a host-provided runtime handle (`runtime::Spawn::Tokio`).
# Native only: on wasm32 the feature compiles to nothing.
rt-tokio = ["dep:tokio"]
