[package]
name = "tuile-viewer"
description = "The interactive globe viewer as a library: window, camera, controls, steering and scripting, generic over where terrain and imagery come from"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
glam = { workspace = true }
# `sync` for the gate a paused session's loads wait on — on every target: the
# browser's worker shuts the same gate.
tokio = { version = "1", default-features = false, features = ["sync"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tuile-atmosphere = { version = "0.15.1", path = "../tuile-atmosphere" }
tuile-camera = { version = "0.15.1", path = "../tuile-camera" }
tuile-core = { version = "0.15.1", path = "../tuile-core" }
# The shapes a host hands over, for `HostFrame::overlays`.
tuile-overlay = { version = "0.15.1", path = "../tuile-overlay" }
tuile-planetary = { version = "0.15.1", path = "../tuile-planetary" }
tuile-tape = { version = "0.15.1", path = "../tuile-tape" }
tuile-terrain = { version = "0.15.1", path = "../tuile-terrain" }
tuile-ui = { version = "0.15.1", path = "../tuile-ui" }
tuile-wgpu = { version = "0.15.1", path = "../tuile-wgpu" }
# Sources named by address (`open`): a terrain's layer.json, an imagery template.
url = { workspace = true }
# A terrain at a URL is stored under a hash of its layer.json when it declares
# no version (`open`); the control API's socket speaks JSON too.
serde_json = { workspace = true }
wgpu = { workspace = true }
web-time = { workspace = true }
winit = { workspace = true }

# The desktop and the phone: an async runtime with threads, the tile store on
# disk, the counters on a local endpoint, the signals. None of it exists in a
# browser, and none of it is reached from the shared application.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Loads as tasks on the viewer's runtime (`Spawn::Tokio`); native only.
tuile-core = { version = "0.15.1", path = "../tuile-core", features = ["rt-tokio"] }
pollster = { workspace = true }
# `time` for the bounded flush of the tile store on the way out.
tokio = { workspace = true, features = ["sync", "time"] }
tuile-storage-foyer = { version = "0.15.1", path = "../tuile-storage-foyer" }
# The sources the command line names by address (`--terrain-url`,
# `--imagery-template`), fetched with no token over the native HTTP stack.
tuile-native-fetchers = { version = "0.15.1", path = "../tuile-native-fetchers" }
# A recording's pictures, encoded on its own threads: JPEG or PNG.
image = { workspace = true }
# Ctrl-C, SIGTERM and SIGHUP have to end the *session*, not the process: a
# recording is most valuable in exactly the run that ends badly. A safe wrapper
# rather than raw `libc::signal`, because the workspace denies `unsafe_code`.
ctrlc = { version = "3.5", features = ["termination"] }
# The Prometheus bridge. It lives in its own crate rather than here because
# nothing about publishing the engine's counters is specific to a wgpu window:
# the headless probes and the warm-up job want exactly the same endpoint.
tuile-metrics = { version = "0.15.1", path = "../tuile-metrics" }
# The configuration file a tester opens (`config_file`): TOML, read into a
# table and checked key by key, so an error can name the key without the
# value.
toml = "1.1"
# An import link's file, fetched (`import::fetch`): the client the native
# fetchers already bring, with their TLS.
reqwest = { workspace = true, features = ["stream"] }
futures-util = { workspace = true }

# The browser: the page and the worker are one wasm module (see `web`). Each
# crate below is the wasm-bindgen project's own or the workspace's:
# `wasm-bindgen`, `wasm-bindgen-futures`, `js-sys` and `web-sys` are the
# bindings every Rust crate in a browser goes through; `serde-wasm-bindgen`
# reads the page's options object into typed Rust; `console_error_panic_hook`
# turns a panic into a message instead of `unreachable`. `wgpu` gains its two
# browser backends: WebGPU first, WebGL2 where the browser has no WebGPU.
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
js-sys = "0.3.76"
serde = { workspace = true }
serde-wasm-bindgen = "0.6.5"
tuile-cesium-ion = { version = "0.15.1", path = "../tuile-cesium-ion" }
tuile-web = { version = "0.15.1", path = "../tuile-web" }
wasm-bindgen = "0.2.99"
wasm-bindgen-futures = "0.4.49"
wgpu = { workspace = true, features = ["webgpu", "webgl"] }

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3.76"
features = [
    "Clipboard",
    "console",
    "Coordinates",
    "CssStyleDeclaration",
    "DedicatedWorkerGlobalScope",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "Geolocation",
    "HtmlCanvasElement",
    "HtmlElement",
    "KeyboardEvent",
    "MessageEvent",
    "Navigator",
    "Node",
    "Permissions",
    "PermissionState",
    "PermissionStatus",
    "Position",
    "PositionError",
    "PositionOptions",
    "Storage",
    "Window",
    "Worker",
    "WorkerNavigator",
]

[dev-dependencies]
# The crate itself with its control API, so that its own tests build and run
# that module too. A development dependency: no build of the application
# ever has it — see the `control` feature. The headless runs themselves need a
# host's sources, and live with the host: `examples/wgpu-viewer/tests`.
tuile-viewer = { path = ".", features = ["control"] }
futures-executor = { workspace = true }
futures-util = { workspace = true }
# The browser's options, read on the host by their tests.
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

# Android: winit's backend over the platform's native activity (no Java of
# the application's own beyond the small `TuileActivity`, so no Gradle);
# `jni` to call that activity, at the version the TLS verifier below already
# brings; logcat through the NDK's log library; and the platform's trust
# store, which on Android needs the JVM handed to it. Each is the
# rust-mobile or rustls project's own crate, and each is what winit, reqwest
# and android-activity already build on.
[target.'cfg(target_os = "android")'.dependencies]
android_log-sys = "0.3"
jni = { version = "0.22.4", default-features = false }
rustls-platform-verifier = "0.7.0"
winit = { workspace = true, features = ["android-native-activity"] }

# The menu-bar readout is a desktop's: a phone has no menu bar, and the crates
# behind it do not build there.
[target.'cfg(not(any(target_os = "ios", target_os = "android", target_arch = "wasm32")))'.dependencies]
tuile-ui = { version = "0.15.1", path = "../tuile-ui", features = ["statusbar"] }

# A process started from an icon gets 256 file descriptors; the tile store
# alone wants more. The established safe wrapper over `setrlimit`, since the
# workspace denies `unsafe_code`.
[target.'cfg(unix)'.dependencies]
rlimit = "0.10"

# The operating system's location service, for `--here` and the `L` key.
# macOS and iOS, and only this example: no library crate knows where the
# machine is. Without the feature, or on another platform, the flag and the key
# answer "not available" and the viewer runs as it always did.
# The Keychain, where an imported token is kept (`secrets`): the established
# safe wrapper, already in the graph through the TLS verifier.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
security-framework = "3.7"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.4", optional = true }
objc2-foundation = { version = "0.3.2", optional = true, default-features = false, features = ["std", "NSAppleEventDescriptor", "NSAppleEventManager", "NSArray", "NSDate", "NSDictionary", "NSError", "NSRunLoop", "NSScriptCommand", "NSScriptCommandDescription", "NSString", "NSURL", "NSValue"] }
# The alert shown when there is no terminal, and the clipboard.
objc2-app-kit = { version = "0.3.2", optional = true, default-features = false, features = ["std", "NSAlert", "NSApplication", "NSPasteboard", "NSResponder", "NSRunningApplication"] }
# The menu bar. The menu crate this workspace already locks, through the
# status-bar readout of `tuile-ui`; nothing is added to the dependency graph.
muda = { version = "0.21", optional = true, default-features = false }
objc2-core-location = { version = "0.3.2", optional = true, default-features = false, features = ["std", "CLLocation", "CLLocationManager", "CLLocationManagerDelegate"] }

# The phone: the same location service, plus what a handset asks of the
# system and a desktop never needs to — how much memory the process may still
# take, how hot the device is running, a message shown over the window, the
# clipboard. The same bindings as the desktop's, from the same release train.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = { version = "0.6.4", optional = true }
objc2-foundation = { version = "0.3.2", optional = true, default-features = false, features = ["std", "NSArray", "NSBundle", "NSDate", "NSDictionary", "NSError", "NSProcessInfo", "NSRunLoop", "NSString", "NSURL", "NSUserDefaults", "NSValue"] }
objc2-ui-kit = { version = "0.3.2", optional = true, default-features = false, features = ["std", "block2", "objc2-core-foundation", "UIAlertController", "UIApplication", "UIColor", "UIFont", "UIGeometry", "UILabel", "UIPasteboard", "UIResponder", "UIView", "UIViewController", "UIWindow"] }
objc2-core-foundation = { version = "0.3.2", optional = true, default-features = false, features = ["std", "CFCGTypes"] }
objc2-core-location = { version = "0.3.2", optional = true, default-features = false, features = ["std", "CLLocation", "CLLocationManager", "CLLocationManagerDelegate"] }

[features]
default = ["current-location", "application"]
current-location = ["dep:objc2", "dep:objc2-foundation", "dep:objc2-core-location"]
# What makes the viewer an application on its desktop: steering URLs from
# other programs, a message window when there is no terminal, the clipboard.
# On a phone: the message over the window, the clipboard, and the device's
# memory and temperature. macOS and iOS; elsewhere it compiles to nothing.
application = ["dep:objc2", "dep:objc2-foundation", "dep:objc2-app-kit", "dep:muda", "dep:objc2-ui-kit", "dep:objc2-core-foundation"]
# The control API (`control`): the viewer headless — offscreen eyes read
# back every frame, on the host's real sources, store and session — the
# commands that drive it and a localhost socket that speaks them. For tests
# and for debug builds a device is driven through; never in a build that
# ships, and refused outright in an iOS release build. A build feature and
# never a runtime switch: a binary either has it or does not.
control = []
