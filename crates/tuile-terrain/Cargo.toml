[package]
name = "tuile-terrain"
description = "Quantized-mesh terrain decoding and geographic tiling for tuile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# Availability gaps are worth naming when they happen; the source crates
# already log their fetches, and tracing is wasm-clean.
tracing = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
glam = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Tile addresses resolved against their layer.json (`LayerJson::tile_request_url`).
url = { workspace = true }
thiserror = { workspace = true }
tuile-core = { version = "0.15.1", path = "../tuile-core" }

[dev-dependencies]
# A gzip stream, to be refused (`decode`).
flate2 = { workspace = true }
futures-executor = { workspace = true }
glam = { workspace = true }
# The HTTP source against a server on a local port (`http`), through the
# core's plain HTTP fetcher.
tokio = { workspace = true, features = ["rt", "net", "io-util", "macros"] }
tuile-core = { version = "0.15.1", path = "../tuile-core", features = ["http"] }
