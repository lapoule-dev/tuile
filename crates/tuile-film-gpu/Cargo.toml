[package]
name = "tuile-film-gpu"
description = "Renders a pre-baked film on wgpu: one visibility raster, everything else in compute"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
bytemuck = { workspace = true }
glam = { workspace = true }
thiserror = { workspace = true }
tuile-atmosphere = { version = "0.12.0", path = "../tuile-atmosphere" }
# The stitching's band and the strips of a tile that has none.
tuile-core = { version = "0.12.0", path = "../tuile-core" }
tuile-film = { version = "0.12.0", path = "../tuile-film" }
wgpu = { workspace = true }
# The card's own clock on each pass, through timestamp queries: the queries
# in flight resolved a few frames late, never waited for. 0.27 is the line
# for wgpu 29; it compiles and runs on wasm32 too (no process id asked there).
wgpu-profiler = "0.27"

[dev-dependencies]
image = { workspace = true }
# The made-up terrain of tests/no_seams.rs.
tuile-terrain = { version = "0.12.0", path = "../tuile-terrain" }
pollster = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
